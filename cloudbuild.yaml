# Public configuration only. Server credentials belong in Cloud Run at runtime.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - --build-arg=NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${_NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}
      - --build-arg=NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg=NEXT_PUBLIC_USER_APP_URL=${_NEXT_PUBLIC_USER_APP_URL}
      - --tag=asia-south1-docker.pkg.dev/$PROJECT_ID/urocms/urocms:$BUILD_ID
      - .
images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/urocms/urocms:$BUILD_ID
substitutions:
  _NEXT_PUBLIC_APP_URL: ''
  _NEXT_PUBLIC_USER_APP_URL: ''
timeout: 1800s
